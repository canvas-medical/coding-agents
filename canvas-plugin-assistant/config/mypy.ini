; The canonical Canvas mypy ruleset for plugin code, and the only copy of it.
;
; Three things read this file: /cpa:style falls back to it for a plugin that
; ships no mypy.ini of its own, /cpa:new-plugin copies it into every scaffold,
; and Studio's deploy gate mirrors it at
; studio_server/backend/style_configs/mypy.ini, pinned equal by a test there.
; A plugin's own mypy.ini always takes priority over this one.
;
; Unlike its neighbor pyproject.toml, this file is not synced from anywhere:
; update-canvas-ruff-config.yml replaces that file by exact name on a weekly
; cron and touches nothing else here.
[mypy]
explicit_package_bases = True

check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
; Exempt three third-party packages that ship no usable annotations. Same
; exclusion canvas-plugins uses, for the reason it cites (typeshed#10592).
; Must stay on its own line: mypy's config parser has no inline comments.
untyped_calls_exclude = canvas_generated,factory,redis
disallow_untyped_decorators = False
disallow_untyped_defs = True
error_summary = True

show_error_context = True
strict_equality = True
strict_optional = True

warn_no_return = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True

follow_imports = silent
ignore_missing_imports = True
; ignore_missing_imports already makes an un-stubbed third-party import Any.
; import-untyped fires only on the subset whose stubs happen to be published to
; PyPI but are absent here, so without this the verdict turns on packaging
; trivia: `import dateutil` is an error while an obscure library is silently
; Any. It is also the one class of finding a plugin author cannot act on, since
; stubs can only be installed into the Studio image. canvas-plugins instead
; installs the types-* packages it needs; that does not transfer, because the
; set of libraries a plugin might import is open-ended.
disable_error_code = import-untyped
no_implicit_optional = True
pretty = False

python_version = 3.12
; Keep mypy out of the plugin's own virtualenv and tooling dirs, matching the
; set ruff and the style digest exclude. mypy auto-skips dot-prefixed names, but
; a bare `venv/` or `env/` is walked and any top-level module inside it checked,
; so a stray error there would fail a required check against code that is not the
; plugin's. `debug` is the original scaffold exclusion, kept.
exclude = (^|/)(\.venv|venv|env|\.tox|\.nox|\.direnv|debug)($|/)
